name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Debug OIDC environment
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "NPM_CONFIG_USERCONFIG: ${NPM_CONFIG_USERCONFIG:-unset}"
          cat "${NPM_CONFIG_USERCONFIG:-/dev/null}" 2>/dev/null || echo "no userconfig"

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Publish with OIDC
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-}"
          unset NPM_CONFIG_USERCONFIG
          npm publish --access public --provenance
