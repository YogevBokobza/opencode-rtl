name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm 12
        run: npm install -g npm@12

      - name: Verify
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "OIDC URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Stage publish with OIDC
        run: npm stage publish --access public --provenance
