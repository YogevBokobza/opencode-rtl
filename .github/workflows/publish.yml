name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm 12
        run: npm install -g npm@12

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Stage publish with OIDC
        run: npm stage publish --access public --provenance --loglevel verbose 2>&1 || true
        env:
          NODE_DEBUG: http,https

      - name: Show npm debug log
        if: always()
        run: cat /home/runner/.npm/_logs/*-debug-*.log 2>/dev/null | tail -100 || echo "no debug log"
